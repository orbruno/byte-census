[project]
name = "byte-census"
version = "2.0.0"
description = "CLI tool for finding and managing duplicate files using cryptographic hashing"
authors = [{name = "Orlando Bruno"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.urls]
Repository = "https://github.com/orbruno/duplicate-finder-cli"

[project.scripts]
byte-census = "byte_census.cli:main"
dupfind = "byte_census.legacy.dupfind:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/byte_census"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
extend-exclude = ["docs/benchmarks"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=byte_census --cov-report=term-missing --cov-fail-under=80"
