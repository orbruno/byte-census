[project]
name = "duplicate-finder-cli"
version = "1.0.0"
description = "CLI tool for finding and managing duplicate files using cryptographic hashing"
authors = [{name = "Orlando Bruno"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.urls]
Repository = "https://github.com/orbruno/duplicate-finder-cli"

[project.scripts]
dupfind = "duplicate_finder_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
